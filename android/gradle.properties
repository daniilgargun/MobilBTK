org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier не нужен: все зависимости давно на AndroidX.
# Он только замедляет сборку и перепаковывает артефакты.
android.enableJetifier=false
# Отключаем инкрементальную компиляцию Kotlin для решения проблемы с разными дисками на Windows
kotlin.incremental=false
# Память для демона компиляции Kotlin.
# Раньше здесь было -Dkotlin.daemon.jvm.options=-Xmx2g: этот параметр
# передавался самому демону как JVM-аргумент, тот не запускался
# ("Could not connect to Kotlin compile daemon"), и Kotlin каждый раз
# откатывался на компиляцию внутри процесса Gradle после четырёх попыток.
kotlin.daemon.jvmargs=-Xmx2g
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
