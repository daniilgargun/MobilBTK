name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      # Сборка требует секретов, которых нет в репозитории:
      # android/app/google-services.json (плагин google-services) и
      # android/key.properties (подпись release). Поэтому шаги сборки
      # не блокируют проверку — форматирование, анализ и тесты блокируют.
      - name: Build APK (Debug)
        run: flutter build apk --debug
        continue-on-error: true

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release
        continue-on-error: true
