name = "btk-schedule-watcher"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Идентификатора аккаунта здесь намеренно нет.
#
# Воркер живёт на отдельном аккаунте Cloudflare — не на том, где уже что-то
# развёрнуто. Аккаунт задаётся переменными окружения при развёртывании
# (CLOUDFLARE_ACCOUNT_ID и CLOUDFLARE_API_TOKEN), см. README.md. Так в
# репозитории не оказывается ни идентификаторов, ни ключей, и `wrangler login`
# на рабочей машине не переключается на другой аккаунт.

# Проверка страницы раз в 15 минут, 07:00–21:00 по Минску, кроме воскресенья.
#
# В cron время UTC, а Минск — UTC+3 круглый год, без перевода часов. Поэтому
# 07:00–21:00 местного превращаются в 04:00–18:00 UTC, а дни недели не
# съезжают: и начало, и конец окна попадают в те же сутки.
#
# Записей две, потому что одна даёт неверный край: `*/15 4-18` — это ещё и
# 18:15, 18:30, 18:45 UTC, то есть без четверти десять вечера по Минску, на
# сорок пять минут позже окна. Поэтому четверти идут до 17:45 UTC (20:45
# местного), а ровно 21:00 добирается отдельной записью.
#
# Окно то же, что у фоновой синхронизации в приложении: ночью и по
# воскресеньям колледж расписание не меняет.
[triggers]
crons = ["*/15 4-17 * * 1-6", "0 18 * * 1-6"]

[vars]
# Адрес страницы расписания. Отдаёт 301 на /ru/-вариант, редирект
# отслеживается автоматически.
SCHEDULE_URL = "https://bartc.by/index.php/obuchayushchemusya/dnevnoe-otdelenie/tekushchee-raspisanie"

# Тема FCM, на которую подписано приложение. Должна совпадать с
# PushService.topic в lib/services/push_service.dart.
FCM_TOPIC = "schedule_all"

# Идентификатор проекта Firebase — тот же, что в google-services.json.
# Не секрет: он виден в самом приложении.
FIREBASE_PROJECT_ID = "btc-raspisanie"

# Состояние между запусками: хэш страницы и кэш токена доступа Google.
# Идентификатор подставляется при создании, см. README.md.
[[kv_namespaces]]
binding = "STATE"
id = "17110d262fb54fdb9831c5e0d0a0383c"
